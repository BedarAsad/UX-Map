<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visitor journey</title>
<script>
/* Fill this object only. Everything below renders from it.
   status: "ok" (works well) | "warn" (slows people down) | "bad" (people get stuck)
   icon:   "loading" | "pin" | "list" | "question" | "phone" | "share" | "cart" | "card" | "user" | "search" | "mail" | "check"
   tag:    optional red label for "bad" stops, e.g. "People get stuck here" / "People leave here"
   layout: "portrait" (default) or "landscape" — the page also has a toggle; ?layout=landscape overrides */
const JOURNEY = {
  layout: "portrait",
  kicker: "Example Site · visitor journey",
  headline: ["Finding it is easy.", "Understanding it is hard."],
  lead: "We followed one visitor from opening the site to taking action. They get stuck at the moment that matters most:",
  leadQuote: "\"Is this good or bad?\"",
  stops: [
    { status: "warn", icon: "loading",  title: "Open the website", text: "A loading circle spins for about 9 seconds.", thought: "\"Is it broken?\"" },
    { status: "ok",   icon: "pin",      title: "Pick your area",   text: "The map zooms straight to it.", thought: "\"Good, there's my area.\"" },
    { status: "bad",  icon: "question", title: "Check one item",   text: "The popup shows a bare number with no scale.", thought: "\"Is 2.59 good or bad?\"", tag: "People get stuck here" }
  ],
  fixes: [
    { title: "Say it in words", text: "Show the level in words next to every number." },
    { title: "Keep phone users here", text: "Tapping an item should show it, not leave the site." },
    { title: "Explain the codes", text: "Show the result count and what each code means." }
  ]
};
</script>
<style>
  :root { --ink:#1f2933; --soft:#52606d; --bg:#fbf7f0; --card:#fff; --ok:#2f9e6e; --warn:#e8a33d; --bad:#d64545; --road:#d9cbb4; --chip:#f3efe7; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); font-family:"Segoe UI", system-ui, -apple-system, sans-serif; color:var(--ink); }
  .sheet { width:900px; margin:0 auto; padding:44px 40px 48px; background:var(--bg); }
  header { text-align:center; }
  .kicker { font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:var(--soft); }
  h1 { font-size:40px; margin:10px 0 12px; line-height:1.15; }
  .lead { font-size:19px; color:var(--soft); margin:0 auto; max-width:700px; line-height:1.45; }
  .lead b { color:var(--bad); }
  .legend { display:flex; justify-content:center; gap:22px; font-size:14px; color:var(--soft); margin:18px 0 28px; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
  .ok { background:var(--ok); } .warn { background:var(--warn); } .bad { background:var(--bad); }
  .journey { position:relative; padding-top:70px; }
  .road { position:absolute; left:400px; top:40px; bottom:0; width:20px; background:var(--road); border-radius:10px; }
  .road::after { content:""; position:absolute; left:8px; top:0; bottom:0; border-left:4px dashed #fff; }
  .stop { position:relative; height:160px; }
  .node { position:absolute; left:386px; top:24px; width:48px; height:48px; border-radius:50%; border:6px solid var(--bg); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:20px; z-index:2; }
  .card { position:absolute; top:0; width:360px; background:var(--card); border-radius:18px; padding:18px 20px; border-top:6px solid; box-shadow:0 2px 0 rgba(0,0,0,.06); z-index:1; }
  .card.ok { border-color:var(--ok); } .card.warn { border-color:var(--warn); } .card.bad { border-color:var(--bad); }
  .stop:nth-child(odd) .card { left:0; } .stop:nth-child(even) .card { left:460px; }
  .row { display:flex; gap:14px; align-items:flex-start; }
  .icon { flex:0 0 52px; height:52px; border-radius:14px; background:var(--chip); display:flex; align-items:center; justify-content:center; }
  .card h2 { font-size:21px; margin:2px 0 6px; }
  .card p { font-size:16px; margin:0; color:var(--soft); line-height:1.4; }
  .say { margin-top:10px; font-size:15px; font-style:italic; background:var(--chip); border-radius:10px; padding:8px 12px; }
  .tag { display:inline-block; margin-top:10px; font-size:13px; font-weight:700; padding:4px 10px; border-radius:20px; color:#fff; background:var(--bad); }
  .walker { position:absolute; left:375px; top:0; width:70px; z-index:5; animation-timing-function:ease-in-out; animation-iteration-count:infinite; }
  .walker svg { display:block; animation:bob .6s infinite alternate ease-in-out; }
  @keyframes bob { from { transform:translateY(0) } to { transform:translateY(-6px) } }
  .fixes h3 { text-align:center; font-size:26px; margin:40px 0 18px; }
  .fixrow { display:flex; gap:18px; }
  .fix { flex:1; background:var(--ink); color:#fff; border-radius:18px; padding:18px; }
  .fix .n { width:34px; height:34px; border-radius:50%; background:var(--ok); display:flex; align-items:center; justify-content:center; font-weight:700; margin-bottom:10px; }
  .fix b { display:block; font-size:18px; margin-bottom:6px; }
  .fix span { font-size:15px; color:#cbd2d9; line-height:1.4; }
  .sheet { position:relative; }
  .modes { position:absolute; top:16px; right:16px; display:flex; background:#fff; border-radius:999px; padding:4px; box-shadow:0 1px 3px rgba(0,0,0,.12); z-index:10; }
  .modes button { border:0; background:none; font:600 13px "Segoe UI", system-ui, sans-serif; color:var(--soft); padding:7px 14px; border-radius:999px; cursor:pointer; }
  .modes button.on { background:var(--ink); color:#fff; }
  body.still .modes { display:none; }
  body.land .sheet { width:1600px; }
  body.land .journey { padding-top:0; }
  body.land .stop { position:static; height:auto; }
  body.land .road { left:0; right:0; width:auto; height:20px; bottom:auto; }
  body.land .road::after { left:0; right:0; top:8px; bottom:auto; border-left:0; border-top:4px dashed #fff; }
  .stem { display:none; position:absolute; width:3px; border-radius:2px; z-index:0; }
  body.land .stem { display:block; }
  body.land .fixrow { max-width:1200px; margin:0 auto; }
  @media (prefers-reduced-motion: reduce) { .walker, .walker svg { animation:none !important; } }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script>
const ICONS = {
  loading: c => `<circle cx="15" cy="15" r="11" fill="none" stroke="${c}" stroke-width="4" stroke-dasharray="50 20"/>`,
  pin: c => `<path d="M15 3C9 3 5 7.5 5 13c0 7 10 14 10 14s10-7 10-14c0-5.5-4-10-10-10z" fill="${c}"/><circle cx="15" cy="13" r="4" fill="#fff"/>`,
  list: c => `<rect x="4" y="6" width="22" height="4" rx="2" fill="${c}"/><rect x="4" y="13" width="22" height="4" rx="2" fill="${c}"/><rect x="4" y="20" width="22" height="4" rx="2" fill="${c}"/>`,
  question: c => `<circle cx="15" cy="15" r="12" fill="${c}"/><text x="15" y="21" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" font-family="Segoe UI,sans-serif">?</text>`,
  phone: c => `<rect x="8" y="3" width="14" height="24" rx="3" fill="${c}"/><rect x="10" y="6" width="10" height="16" rx="1" fill="#fff"/>`,
  share: c => `<circle cx="8" cy="15" r="4" fill="${c}"/><circle cx="22" cy="7" r="4" fill="${c}"/><circle cx="22" cy="23" r="4" fill="${c}"/><path d="M11 13L19 9M11 17L19 21" stroke="${c}" stroke-width="2.5"/>`,
  cart: c => `<path d="M3 5h4l3 14h13l3-10H9" fill="none" stroke="${c}" stroke-width="2.6" stroke-linejoin="round"/><circle cx="12" cy="24" r="2.4" fill="${c}"/><circle cx="21" cy="24" r="2.4" fill="${c}"/>`,
  card: c => `<rect x="3" y="7" width="24" height="17" rx="3" fill="${c}"/><rect x="3" y="11" width="24" height="3" fill="#fff"/>`,
  user: c => `<circle cx="15" cy="10" r="5.5" fill="${c}"/><path d="M5 26c0-6 4.5-9 10-9s10 3 10 9z" fill="${c}"/>`,
  search: c => `<circle cx="13" cy="13" r="8" fill="none" stroke="${c}" stroke-width="3"/><path d="M19 19l7 7" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/>`,
  mail: c => `<rect x="3" y="7" width="24" height="17" rx="3" fill="${c}"/><path d="M4 9l11 8 11-8" fill="none" stroke="#fff" stroke-width="2"/>`,
  check: c => `<circle cx="15" cy="15" r="12" fill="${c}"/><path d="M9 15l4 4 8-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`
};
const COLOR = { ok:"#2f9e6e", warn:"#e8a33d", bad:"#d64545" };
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const J = JOURNEY, n = J.stops.length, params = new URLSearchParams(location.search);
const STILL = params.has("still");
document.title = J.kicker;
if (STILL) document.body.classList.add("still");
const walker = `<div class="walker" aria-hidden="true"><svg width="70" height="63" viewBox="0 0 100 90"><circle cx="50" cy="18" r="13" fill="#f2c094"/><path d="M37 16Q50 0 63 16Q58 8 50 8Q42 8 37 16Z" fill="#3b2f2a"/><circle cx="45" cy="18" r="1.8" fill="#1f2933"/><circle cx="55" cy="18" r="1.8" fill="#1f2933"/><path d="M45 24Q50 27 55 24" stroke="#1f2933" stroke-width="1.8" fill="none" stroke-linecap="round"/><rect x="36" y="32" width="28" height="30" rx="10" fill="#3d7ea6"/><rect x="62" y="36" width="12" height="20" rx="3" fill="#1f2933"/><rect x="64" y="38" width="8" height="14" rx="1" fill="#9fd3c7"/><rect x="40" y="60" width="8" height="22" rx="4" fill="#33415c"/><rect x="52" y="60" width="8" height="22" rx="4" fill="#33415c"/></svg></div>`;
document.getElementById("sheet").innerHTML = `
  <div class="modes" role="group" aria-label="Layout"><button data-mode="portrait">Portrait</button><button data-mode="landscape">Landscape</button></div>
  <header><div class="kicker">${esc(J.kicker)}</div><h1>${J.headline.map(esc).join("<br>")}</h1>
  <p class="lead">${esc(J.lead)} <b>${esc(J.leadQuote || "")}</b></p></header>
  <div class="legend"><span><i class="ok"></i>Works well</span><span><i class="warn"></i>Slows people down</span><span><i class="bad"></i>People get stuck</span></div>
  <div class="journey"><div class="road"></div>${walker}
  ${J.stops.map((s, i) => `<div class="stop"><div class="stem ${s.status}"></div><div class="node ${s.status}">${i + 1}</div><div class="card ${s.status}">
    <div class="row"><div class="icon"><svg width="30" height="30" viewBox="0 0 30 30">${(ICONS[s.icon] || ICONS.check)(COLOR[s.status])}</svg></div>
    <div><h2>${esc(s.title)}</h2><p>${esc(s.text)}</p></div></div>
    ${s.thought ? `<div class="say">${esc(s.thought)}</div>` : ""}${s.tag ? `<span class="tag">${esc(s.tag)}</span>` : ""}</div></div>`).join("")}
  </div>
  <div class="fixes"><h3>Fix these ${J.fixes.length === 3 ? "three" : J.fixes.length} first</h3><div class="fixrow">
  ${J.fixes.map((f, i) => `<div class="fix"><div class="n">${i + 1}</div><b>${esc(f.title)}</b><span>${esc(f.text)}</span></div>`).join("")}</div></div>`;

const anim = document.createElement("style");
document.head.appendChild(anim);
const journey = document.querySelector(".journey"), road = document.querySelector(".road");
const stops = [...document.querySelectorAll(".stop")];
const frames = (prop, vals) => vals.map((v, i) => `${(i * 100 / n).toFixed(1)}%,${(i * 100 / n + 50 / n).toFixed(1)}% { ${prop}:${v}px; }`).join(" ") + ` 100% { ${prop}:${vals[0]}px; }`;

function layout(mode) {
  const land = mode === "landscape";
  document.body.classList.toggle("land", land);
  document.querySelectorAll(".modes button").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
  [journey, road, ...stops, ...document.querySelectorAll(".stop .card, .stop .node, .stop .stem")].forEach(el => el.removeAttribute("style"));
  let css;
  if (!land) {
    stops.forEach(st => { st.style.height = Math.max(160, st.querySelector(".card").offsetHeight + 24) + "px"; });
    const tops = stops.map(st => st.offsetTop + 24 - 64);
    css = `@keyframes walk { ${frames("top", tops)} } .walker { left:375px; top:${tops[0]}px; animation-name:walk; animation-duration:${n * 3}s; }`;
  } else {
    const inner = journey.clientWidth, spacing = inner / n, cardW = Math.min(400, 2 * spacing - 40, (2.5 * spacing - 20) / 1.5);
    const xs = stops.map((_, i) => i * spacing + spacing / 2);
    const cards = stops.map(st => st.querySelector(".card"));
    cards.forEach(c => { c.style.width = cardW + "px"; });
    const hs = cards.map(c => c.offsetHeight);
    const aboveMax = Math.max(0, ...hs.filter((_, i) => i % 2 === 0));
    const belowMax = Math.max(0, ...hs.filter((_, i) => i % 2 === 1));
    const roadY = aboveMax + 80;
    cards.forEach((c, i) => {
      c.style.left = Math.min(Math.max(xs[i] - cardW / 2, 0), inner - cardW) + "px";
      c.style.top = (i % 2 === 0 ? roadY - 80 - hs[i] : roadY + 50) + "px";
    });
    stops.forEach((st, i) => {
      const sm = st.querySelector(".stem"), above = i % 2 === 0;
      sm.style.left = (xs[i] - 1.5) + "px";
      sm.style.top = (above ? roadY - 80 : roadY + 34) + "px";
      sm.style.height = (above ? 66 : 16) + "px";
    });
    stops.forEach((st, i) => { const nd = st.querySelector(".node"); nd.style.left = (xs[i] - 24) + "px"; nd.style.top = (roadY - 14) + "px"; });
    road.style.top = roadY + "px";
    journey.style.height = (roadY + 50 + belowMax) + "px";
    const lefts = xs.map(x => Math.round(x - 35));
    css = `@keyframes walk { ${frames("left", lefts)} } .walker { top:${roadY - 77}px; left:${lefts[0]}px; animation-name:walk; animation-duration:${n * 3}s; }`;
  }
  anim.textContent = css + (STILL ? " .walker, .walker svg { animation:none !important; }" : "");
  const sheet = document.getElementById("sheet").getBoundingClientRect();
  document.body.setAttribute("data-height", Math.ceil(sheet.height));
  document.body.setAttribute("data-width", Math.ceil(sheet.width));
}
document.querySelectorAll(".modes button").forEach(b => b.addEventListener("click", () => layout(b.dataset.mode)));
layout(params.get("layout") === "landscape" || (!params.get("layout") && J.layout === "landscape") ? "landscape" : "portrait");
</script>
</body>
</html>
